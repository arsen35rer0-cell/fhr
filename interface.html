<!-- interface.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Shadow OSINT</title>
    <style>
        :root{--bg:#08080a;--p:#121216;--a:#00c8ff;--t:#d0d0d0}
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Consolas',monospace}
        body{background:var(--bg);color:var(--t);display:flex;height:100vh;overflow:hidden}
        .side{width:220px;background:var(--p);padding:20px;border-right:1px solid #222;display:flex;flex-direction:column;gap:8px}
        .logo{color:var(--a);font-size:16px;font-weight:bold;margin-bottom:25px;letter-spacing:2px;text-transform:uppercase}
        .btn{background:transparent;border:1px solid #2a2a2a;color:#666;padding:12px;cursor:pointer;text-align:left;transition:.2s;font-size:13px}
        .btn:hover,.btn.act{border-color:var(--a);color:var(--a);background:rgba(0,200,255,.05)}
        .main{flex:1;padding:30px;display:flex;flex-direction:column}
        .search{display:flex;gap:10px;margin-bottom:25px}
        input{flex:1;background:var(--p);border:1px solid #2a2a2a;color:#fff;padding:14px;font-size:15px;outline:none}
        input:focus{border-color:var(--a)}
        .run{background:var(--a);border:none;color:#000;font-weight:bold;padding:0 35px;cursor:pointer;text-transform:uppercase;font-size:13px}
        .run:hover{filter:brightness(1.2)}
        .term{background:#000;border:1px solid #222;flex:1;padding:20px;overflow-y:auto;font-size:13px;line-height:1.7}
        .l{margin-bottom:4px}.li{color:#666}.ls{color:#0f0}.lw{color:#fa0}.ld{color:var(--a);border-left:2px solid var(--a);padding-left:10px;margin:8px 0;display:block;white-space:pre-wrap}
        .stats{display:flex;gap:20px;margin-bottom:15px;font-size:12px;color:#555}
        .stat span{color:var(--a)}
    </style>
</head>
<body>
    <div class="side">
        <div class="logo">Shadow.OSINT</div>
        <button class="btn act">🔍 Username Check</button>
        <button class="btn">📧 Email Breach</button>
        <button class="btn">🌐 URL Analysis</button>
        <button class="btn">⚙️ Config</button>
    </div>
    <div class="main">
        <div class="stats">
            <div class="stat">Sites: <span id="siteCount">0</span></div>
            <div class="stat">Found: <span id="foundCount">0</span></div>
            <div class="stat">Time: <span id="timeElapsed">0.0s</span></div>
        </div>
        <div class="search">
            <input type="text" id="target" placeholder="Введите никнейм (например: pavlov)">
            <button class="run" onclick="start()">ANALYZE</button>
        </div>
        <div class="term" id="term">
            <div class="l li">[SYS] Движок готов. Ожидание цели...</div>
        </div>
    </div>
<script>
const T=document.getElementById('term');
const SC=document.getElementById('siteCount');
const FC=document.getElementById('foundCount');
const TE=document.getElementById('timeElapsed');
let found=0;

function log(m,t='i'){
    const d=document.createElement('div');
    d.className=`l ${t==='s'?'ls':t==='w'?'lw':t==='d'?'ld':'li'}`;
    d.textContent=t==='d'?m:`[${new Date().toLocaleTimeString()}] ${m}`;
    T.appendChild(d);T.scrollTop=T.scrollHeight;
}

async function start(){
    const q=document.getElementById('target').value.trim();
    if(!q)return log('Укажите цель','w');
    found=0;FC.textContent='0';
    const t0=performance.now();
    log(`Запуск анализа: "${q}"`);
    
    try{
        const res=await window.pywebview.api.search_username(q);
        const elapsed=((performance.now()-t0)/1000).toFixed(2);
        TE.textContent=elapsed+'s';
        SC.textContent=res.total;
        log(`Анализ завершён за ${elapsed}s. Сайтов проверено: ${res.total}`,'s');
        
        if(res.found.length>0){
            let out='=== НАЙДЕННЫЕ АККАУНТЫ ===\n';
            res.found.forEach(f=>out+=`${f.site}: ${f.url}\n`);
            log(out,'d');
        }else{
            log('Совпадений не найдено','w');
        }
    }catch(e){log('Ошибка: '+e,'w')}
}
</script>
</body>
</html>
